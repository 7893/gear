# Local project label only. Real remote project references stay in private configuration.
project_id = "gear"

[functions.gear-auth-mail]
verify_jwt = false
entrypoint = "./functions/gear-auth-mail/index.ts"
import_map = "./functions/gear-auth-mail/deno.json"

[functions.gear-evidence]
verify_jwt = true
entrypoint = "./functions/gear-evidence/index.ts"
import_map = "./functions/gear-evidence/deno.json"

# Independent scheduler endpoint; never replace the Auth hook entrypoint.
[functions.gear-notification-mail]
verify_jwt = false
entrypoint = "./functions/gear-auth-mail/notification-index.ts"
import_map = "./functions/gear-auth-mail/deno.json"
