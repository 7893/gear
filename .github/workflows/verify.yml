name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned verification tools
        run: bash scripts/install-ci-tools.sh "$RUNNER_TEMP/gear-ci-tools"
      - name: Validate workflow syntax
        run: '"$RUNNER_TEMP/gear-ci-tools/actionlint"'
      - name: Test repository validators
        run: python3 -m unittest discover -s tests -v
      - name: Check certificate tool syntax
        run: python3 -m py_compile infrastructure/certificates/renew.py
      - name: Validate public repository files
        run: python3 scripts/check_repository.py
      - name: Scan Git history for credentials
        run: '"$RUNNER_TEMP/gear-ci-tools/gitleaks" git --redact --no-banner --log-opts="--all"'
      - name: Verify contributor commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_commits.py

  gateway:
    name: Gateway checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.8.1
      - name: Install locked gateway dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, format, type-check, test and build gateway
        run: pnpm run check

  smoke-page:
    name: Static page checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.8.1
      - name: Install locked page dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser for isolated UI tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint, format, type-check, test and build page
        run: pnpm run check

  database:
    name: Database schema checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify schema in disposable database
        run: |
          python3 database/tests/check_schema.py
          python3 database/tests/check_accounts.py
        env:
          PG_BINDIR: /usr/lib/postgresql/16/bin

  auth-mail:
    name: Authentication mail checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/gear-auth-mail
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.8.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify mail adapter with fictional webhook and provider responses
        run: pnpm run check

  deploy:
    name: Deploy and verify
    needs: [repository, gateway, smoke-page, database, auth-mail]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@12.8.1
      - name: Install locked dependencies
        run: |
          pnpm -C infrastructure/gateway install --frozen-lockfile
          pnpm -C web install --frozen-lockfile
      - name: Install browser
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Publish and verify complete connection
        run: python3 scripts/deploy.py
        env:
          GEAR_ACCOUNTS_ENABLED: ${{ vars.GEAR_ACCOUNTS_ENABLED }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          CI_DEPLOY_USER: ${{ secrets.CI_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_NAME: ${{ secrets.CLOUDFLARE_GATEWAY_NAME }}
          BACKEND_DNS_NAME: ${{ secrets.BACKEND_DNS_NAME }}
          GEAR_DB_SCHEMA: ${{ secrets.GEAR_DB_SCHEMA }}
          GEAR_STORAGE_BUCKET: ${{ secrets.GEAR_STORAGE_BUCKET }}
          GEAR_FUNCTION_PREFIX: ${{ secrets.GEAR_FUNCTION_PREFIX }}
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
